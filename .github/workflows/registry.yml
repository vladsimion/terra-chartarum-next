name: registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev
      - run: npm run lint:css
      - name: Browsers for the end-to-end specs
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end specs (Chromium dark and light, Firefox, WebKit, 360 px phone, no JavaScript)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Stub pages and draft copy left in the build (informational until cutover)
        run: npm run build && npm run shell:check
      - name: Integrity gate on canonical content
        run: |
          if [ -d content ]; then
            npm run registry -- check --dir . --out reports
          else
            echo "No content/ directory yet; skipping gate."
          fi
      - name: Site data and leak scan on canonical content
        run: |
          if [ -d content ]; then
            npm run registry -- build --dir . --out build-site-data
            npm run registry -- scan build-site-data --dir .
          else
            echo "No content/ directory yet; skipping site data."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-report
          path: reports/
          if-no-files-found: ignore
