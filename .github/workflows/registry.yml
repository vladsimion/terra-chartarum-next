name: registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the visual baselines and upload them as an artifact (run on the branch, then commit the images)'
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev
      - run: npm run lint:css
      - name: Browsers for the end-to-end specs
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end specs (Chromium dark and light, Firefox, WebKit, 360 px phone, no JavaScript)
        run: npm run test:e2e -- ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: 'true'
      - name: Visual baselines (only on an update run)
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/shell/e2e/**/*-snapshots/
          if-no-files-found: error
      - name: Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Stub pages and draft copy left in the production build (informational until cutover)
        run: npm run build && npm run shell:check
      - name: Lighthouse CI budgets on the listed templates (ADR 0004, mobile profile)
        run: |
          SHELL_FIXTURES=1 REGISTRY_ROOT=tests/shell/fixtures/registry npm run build
          npm run lhci
      - name: Budget guard proof (a page over the JavaScript budget must fail the same assertions)
        run: |
          if npm run lhci -- --collect.url=http://localhost:4322/fixtures/budget/; then
            echo "the over-budget fixture passed the budget, so the budget would not catch a regression"
            exit 1
          fi
      - name: Lighthouse report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
      - name: Integrity gate on canonical content
        run: |
          if [ -d content ]; then
            npm run registry -- check --dir . --out reports
          else
            echo "No content/ directory yet; skipping gate."
          fi
      - name: Site data and leak scan on canonical content
        run: |
          if [ -d content ]; then
            npm run registry -- build --dir . --out build-site-data
            npm run registry -- scan build-site-data --dir .
          else
            echo "No content/ directory yet; skipping site data."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-report
          path: reports/
          if-no-files-found: ignore
