open_questions:
  - field: state
    question: Which folios carry the itinerary in this witness is recorded here as
      fol. 2 and has not been checked against the manuscript; the Crusades
      source audit carries the same volume with its locator still marked
      pending.
    would_resolve: The British Library catalogue entry and digitised foliation for
      Royal MS 14 C VII, which would settle the locator for both records at
      once.
  - field: attribution
    question: Matthew Paris left more than one itinerary copy, and the Corpus
      Christi College manuscripts carry versions that differ from this one.
      Which witness this record should stand on is a choice the essay has not
      yet had to make.
    would_resolve: Collation of Royal MS 14 C VII against CCCC MS 26 and CCCC MS 16,
      both already registered in the Crusades source audit.
