description: The routes across the Carpathians that joined Transylvania to
  Wallachia and Moldavia, drawn as editorial corridors through named towns and
  passes. Sibiu by the Red Tower pass and Brașov by Bran–Rucăr lead to the
  Wallachian seats, Târgoviște across the plain to the Danube at Brăila, and
  Brașov by the Oituz pass into Moldavia. They show that a connection ran this
  way, not the line a road took; no segment is surveyed or traced from a map.
