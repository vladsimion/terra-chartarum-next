question: If every map of Dacia is built from the spolia of the one before it,
  what does each new map bury, and what does it keep?
thesis: "Each new map of Dacia takes from its predecessors what it can still
  use, their measurements, their names and the shape of a coast, and overwrites
  the authority that once gave them meaning: across nineteen centuries the
  places endure on the sheets, while the political worlds that claimed them are
  buried and remade."
