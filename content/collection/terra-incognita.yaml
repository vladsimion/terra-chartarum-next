description: "There is no default composition. Every layer here is in review and
  not one record has been read against its source, so a reader who opens this
  collection is shown nothing as established: the layers have to be switched on
  deliberately. The ghost layer is a member although its asset is empty, because
  a reader looking for the disproved features should find the record of why none
  of them can yet be placed."
