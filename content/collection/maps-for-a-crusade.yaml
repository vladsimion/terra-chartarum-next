description: "The three registers of the Crusades flagship, held together
  because the argument runs between them: a thirteenth-century itinerary
  organises the world as a sequence of days, fifty years earlier a fleet had
  already organised it as ports, contracts and control, and Jerusalem is the
  middle of a world image, the end of a road and a working port in different
  registers at once. No member has a default, because no witness in this corpus
  is cleared for publication and no folio has been transcribed."
